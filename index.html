<!DOCTYPE html>
<html lang="en" dir="ltr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECG Team Platform</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b2430;--mu:#6b7686;--bd:#e1e5ea;--ac:#14365d;--ac2:#e8eef6;--ok:#1e8a5a;--wr:#c27a0a;--er:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#10151c;--card:#19212b;--tx:#e8edf3;--mu:#92a0b2;--bd:#2a3542;--ac:#6ea3e0;--ac2:#1f2d3f;--ok:#4cc38a;--wr:#e0a23c;--er:#ef7a6c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;font-size:15px}
header{background:var(--card);border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header img{height:42px;background:#fff;border-radius:4px;padding:2px}header h1{font-size:17px;margin:0;flex:1}header small{display:block;color:var(--mu);font-weight:400;font-size:12px}
main{max-width:900px;margin:0 auto;padding:16px}nav{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}
button,select,input{font:inherit;color:var(--tx)}
.tab{border:1px solid var(--bd);background:var(--card);padding:8px 16px;border-radius:20px;cursor:pointer;white-space:nowrap}.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}.btn.g{background:var(--ac2);color:var(--ac)}.btn.s{padding:4px 10px;font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}.mu{color:var(--mu);font-size:13px}
.tag{font-size:12px;padding:2px 8px;border-radius:10px;background:var(--ac2);color:var(--ac)}
input,select{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;min-width:0}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.st-done{color:var(--ok)}.bar{height:6px;background:var(--ac2);border-radius:3px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--ok)}
.done .t{text-decoration:line-through;color:var(--mu)}#msg{color:var(--mu);padding:30px;text-align:center}
.auth{max-width:380px;margin:8vh auto;text-align:center}.auth img{height:70px;background:#fff;border-radius:6px;padding:4px;margin-bottom:10px}
.auth .form{grid-template-columns:1fr;text-align:left}.er{color:var(--er);font-size:13px;min-height:18px}a{color:var(--ac);cursor:pointer}
footer{text-align:center;color:var(--mu);font-size:12px;padding:24px 16px}
</style></head><body>
<div id="app"></div>
<footer>© 2026 Khaled Abdelhady. All rights reserved.</footer>
<script type="module">
// ====== PASTE YOUR FIREBASE CONFIG HERE ======
const firebaseConfig = {
  apiKey: "AIzaSyAS4QNm4czzjebUB13saNsQWlbUA3ZApzs",
  authDomain: "ecg-platform-57a38.firebaseapp.com",
  projectId: "ecg-platform-57a38",
  storageBucket: "ecg-platform-57a38.firebasestorage.app",
  messagingSenderId: "668365507328",
  appId: "1:668365507328:web:91e352a29b40bda3a841e5"
};
// ===============================================
if(firebaseConfig.apiKey==="PASTE_HERE"){document.getElementById("app").innerHTML='<div style="padding:40px;text-align:center;font-family:sans-serif">Firebase config is missing. Open index.html in a text editor and paste your config at the top of the script.</div>';throw new Error("config missing")}
import {initializeApp,getApps} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,sendEmailVerification,sendPasswordResetEmail,signOut,updateProfile} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,setDoc,updateDoc,deleteDoc,onSnapshot,getDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const DOMAIN="@ecgsa.com",$=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fapp=initializeApp(firebaseConfig),auth=getAuth(fapp),db=getFirestore(fapp);
const ST={todo:"To Do",prog:"In Progress",done:"Done"},uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let me,lead=false,S={tasks:[],projects:[],users:[],cfg:{}},tab="mine",pf="all",unsubs=[];
const msg=e=>({"auth/invalid-credential":"Wrong email or password.","auth/email-already-in-use":"This email already has an account.","auth/weak-password":"Password must be at least 6 characters.","auth/too-many-requests":"Too many attempts. Try again later.","auth/invalid-email":"Invalid email."}[e.code]||e.message);
function authView(note=""){
 app.innerHTML=`<div class="auth card"><img src="logo.png" alt="ECG"><h2>Sign in</h2><p class="mu">Access is by invitation only.<br>Contact Khaled Abdelhady to get an account.</p>
 <div class="form"><input id="e" type="email" placeholder="name${DOMAIN}"><input id="p" type="password" placeholder="Password"><button class="btn" id="go">Sign in</button></div><div class="er" id="er">${esc(note)}</div></div>`;
 const go=async()=>{const e=$("#e").value.trim().toLowerCase(),p=$("#p").value,er=$("#er");er.textContent="";
  if(!e.endsWith(DOMAIN))return er.textContent="Only "+DOMAIN+" emails are allowed.";
  try{await signInWithEmailAndPassword(auth,e,p)}catch(x){er.textContent=msg(x)}};
 $("#go").onclick=go;$("#p").onkeydown=ev=>{if(ev.key==="Enter")go()}}
function verifyView(u){app.innerHTML=`<div class="auth card"><img src="logo.png"><h2>Verify your email</h2><p class="mu">We sent a link to <b>${esc(u.email)}</b>. Open it, then press the button.</p>
 <div class="row" style="justify-content:center"><button class="btn" id="ok">I verified</button><button class="btn g" id="rs">Resend</button><button class="btn g" id="so">Sign out</button></div><div class="er" id="er"></div></div>`;
 $("#ok").onclick=async()=>{await u.reload();await u.getIdToken(true);u.emailVerified?start(u):$("#er").textContent="Not verified yet."};
 $("#rs").onclick=async()=>{try{await sendEmailVerification(u);$("#er").textContent="Sent again."}catch(x){$("#er").textContent=msg(x)}};$("#so").onclick=()=>signOut(auth)}
let busy=false;onAuthStateChanged(auth,u=>{if(busy)return;unsubs.forEach(f=>f());unsubs=[];if(!u)authView();else if(!u.email.toLowerCase().endsWith(DOMAIN))signOut(auth);else start(u)});
const OWNER="khaled.mabdelhady@ecgsa.com";
async function start(u){me={id:u.uid,email:u.email,name:u.displayName||u.email};
 app.innerHTML='<div id="msg">Loading…</div>';const r=doc(db,"users",me.id);
 if(u.email.toLowerCase()===OWNER){try{const s=await getDoc(r);if(!s.exists())await setDoc(r,{email:me.email,name:me.name,role:"leader",status:"approved"})}catch(e){app.innerHTML='<div id="msg">Error: '+esc(e.message)+'</div>';return}}
 let on=false;
 unsubs.push(onSnapshot(r,s=>{const d=s.data()||{};if(d.status!=="approved"){gate();return}if(on)return;on=true;
  for(const k of["tasks","projects","users"])unsubs.push(onSnapshot(collection(db,k),s=>{S[k]=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>app.innerHTML='<div id="msg">No access: '+esc(e.code)+'</div>'));
  unsubs.push(onSnapshot(doc(db,"settings","company"),s=>{S.cfg=s.exists()?s.data():{};render()}))},e=>app.innerHTML='<div id="msg">Error: '+esc(e.code)+'</div>'))}
function gate(){app.innerHTML='<div class="auth card"><img src="logo.png"><h2>No access</h2><p class="mu">Your account has not been activated. Please contact Khaled Abdelhady.</p><button class="btn g" id="so">Sign out</button></div>';$("#so").onclick=()=>signOut(auth)}
const nm=i=>S.users.find(u=>u.id===i)?.name||"Member",pn=id=>S.projects.find(p=>p.id===id)?.name||"—";
function render(){if(!me)return;lead=S.users.find(u=>u.id===me.id)?.role==="leader";
 app.innerHTML=`<header><img src="${esc(S.cfg.logo||"logo.png")}"><h1>${esc(S.cfg.name||"ECG")}<small>Team Task &amp; Project Platform</small></h1><span class="mu">${esc(me.name)} · ${lead?"Team Leader":"Member"}</span>
 ${lead?'<button class="btn g s" id="set">⚙ Settings</button>':""}<button class="btn g s" id="out">Sign out</button></header><main><nav>${[["mine","My Tasks"],["all","All Tasks"],["proj","Projects"],["team","Team"]].map(([k,l])=>`<button class="tab ${tab===k?"on":""}" data-t="${k}">${l}</button>`).join("")}</nav><div id="v">${tab==="proj"?projView():tab==="team"?teamView():taskView()}</div></main>`;
 $("#out").onclick=()=>signOut(auth);document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});bind()}
function taskCard(t){const mine=t.assignee===me.id;return `<div class="card ${t.status==="done"?"done":""}"><div class="row"><b class="t sp">${esc(t.title)}</b><span class="tag">${esc(pn(t.projectId))}</span></div>
 <div class="row mu" style="margin-top:6px"><span>👤 ${esc(nm(t.assignee))}</span>${t.due?`<span>📅 ${esc(t.due)}</span>`:""}<span class="sp"></span>
 ${(mine||lead)?`<select data-st="${t.id}">${Object.entries(ST).map(([k,l])=>`<option value="${k}" ${t.status===k?"selected":""}>${l}</option>`).join("")}</select>`:`<span class="st-${t.status}">${ST[t.status]}</span>`}
 ${lead?`<button class="btn g s" data-del="${t.id}">Delete</button>`:""}</div></div>`}
function taskView(){let l=S.tasks.filter(t=>tab==="all"||t.assignee===me.id);if(pf!=="all")l=l.filter(t=>t.projectId===pf);
 const o={todo:0,prog:1,done:2};l.sort((a,b)=>o[a.status]-o[b.status]);const open=S.projects.filter(p=>p.status!=="closed");let h="";
 if(lead)h+=`<div class="card"><b>Assign a new task</b><div class="form" style="margin-top:8px"><input id="nt" placeholder="Task title"><select id="np">${open.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")||'<option value="">Create a project first</option>'}</select>
 <select id="na">${S.users.filter(m=>m.status==="approved").map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join("")}</select><input id="nd" type="date"><button class="btn" id="add">Assign</button></div></div>`;
 h+=`<div class="row" style="margin-bottom:10px"><span class="mu">Project:</span><select id="pf"><option value="all">All</option>${S.projects.map(p=>`<option value="${p.id}" ${pf===p.id?"selected":""}>${esc(p.name)}</option>`).join("")}</select></div>`;
 return h+(l.map(taskCard).join("")||'<div id="msg">No tasks here.</div>')}
function projView(){let h=lead?`<div class="card row"><input id="pnm" class="sp" placeholder="New project name"><button class="btn" id="padd">Add project</button></div>`:"";
 return h+(S.projects.map(p=>{const ts=S.tasks.filter(t=>t.projectId===p.id),d=ts.filter(t=>t.status==="done").length,pc=ts.length?Math.round(d/ts.length*100):0,cl=p.status==="closed";
 return `<div class="card"><div class="row"><b class="sp">${esc(p.name)}</b><span class="tag">${cl?"Closed":"Open"}</span>${lead?`<button class="btn g s" data-tg="${p.id}">${cl?"Reopen":"Close"}</button>`:""}</div><div class="mu" style="margin-top:4px">${ts.length} tasks • ${d} done • ${pc}%</div><div class="bar"><i style="width:${pc}%"></i></div></div>`}).join("")||'<div id="msg">No projects yet.</div>')}
function teamView(){const A=S.users.filter(m=>m.status==="approved");let h="";
 if(lead)h+=`<div class="card"><b>Add a team member</b><div class="form" style="margin-top:8px"><input id="mn" placeholder="Full name"><input id="mem" type="email" placeholder="name${DOMAIN}"><input id="mp" type="text" placeholder="Password (min 6)"><button class="btn" id="addm">Add member</button></div><div class="er" id="mer"></div></div>`;
 return h+A.map(m=>{const o=S.tasks.filter(t=>t.assignee===m.id&&t.status!=="done").length;
  return `<div class="card row"><b class="sp">${esc(m.name)}</b><span class="mu">${esc(m.email)}</span><span class="mu">${o} open tasks</span>`+(lead&&m.id!==me.id?`<select data-role="${m.id}"><option value="member" ${m.role!=="leader"?"selected":""}>Member</option><option value="leader" ${m.role==="leader"?"selected":""}>Team Leader</option></select><button class="btn g s" data-rm="${m.id}">Remove</button>`:`<span class="tag">${m.role==="leader"?"Team Leader":"Member"}</span>`)+`</div>`}).join("")}
const q=s=>document.querySelector(s),w=async f=>{try{await f()}catch(e){alert(e.message)}};
function bind(){const pfe=q("#pf");if(pfe)pfe.onchange=()=>{pf=pfe.value;render()};
 document.querySelectorAll("[data-st]").forEach(e=>e.onchange=()=>w(()=>updateDoc(doc(db,"tasks",e.dataset.st),{status:e.value})));
 document.querySelectorAll("[data-del]").forEach(e=>e.onclick=()=>confirm("Delete this task?")&&w(()=>deleteDoc(doc(db,"tasks",e.dataset.del))));
 document.querySelectorAll("[data-tg]").forEach(e=>e.onclick=()=>{const p=S.projects.find(x=>x.id===e.dataset.tg);w(()=>updateDoc(doc(db,"projects",p.id),{status:p.status==="closed"?"open":"closed"}))});
 document.querySelectorAll("[data-role]").forEach(e=>e.onchange=()=>w(()=>updateDoc(doc(db,"users",e.dataset.role),{role:e.value})));
 document.querySelectorAll("[data-ap]").forEach(e=>e.onclick=()=>w(()=>updateDoc(doc(db,"users",e.dataset.ap),{status:"approved"})));
 document.querySelectorAll("[data-rj]").forEach(e=>e.onclick=()=>w(()=>updateDoc(doc(db,"users",e.dataset.rj),{status:"rejected"})));
 const am=q("#addm");if(am)am.onclick=async()=>{const n=q("#mn").value.trim(),e=q("#mem").value.trim().toLowerCase(),p=q("#mp").value,er=q("#mer");er.textContent="";
  if(!n||!e||p.length<6)return er.textContent="Enter a name, an email and a password of at least 6 characters.";
  if(!e.endsWith(DOMAIN))return er.textContent="Email must end with "+DOMAIN;
  am.disabled=true;
  try{const sec=getApps().find(a=>a.name==="sec")||initializeApp(firebaseConfig,"sec"),sa=getAuth(sec),c=await createUserWithEmailAndPassword(sa,e,p);
   await setDoc(doc(db,"users",c.user.uid),{email:e,name:n,role:"member",status:"approved"});await signOut(sa);alert("Added. Login: "+e+" with the password you set.")}
  catch(x){er.textContent=x.code==="auth/email-already-in-use"?"This email already has an account. Delete it in Firebase Console > Authentication > Users, then add it again.":msg(x)}
  am.disabled=false};
 document.querySelectorAll("[data-rm]").forEach(e=>e.onclick=()=>confirm("Remove this person's access?")&&w(()=>deleteDoc(doc(db,"users",e.dataset.rm))));
 const a=q("#add");if(a)a.onclick=()=>{const t=q("#nt").value.trim(),p=q("#np").value,s=q("#na").value;if(!t||!p||!s)return alert("Enter a title and pick a project and a person");
  w(()=>setDoc(doc(db,"tasks",uid()),{title:t,projectId:p,assignee:s,due:q("#nd").value,status:"todo",by:me.id}))};
 const pa=q("#padd");if(pa)pa.onclick=()=>{const n=q("#pnm").value.trim();if(n)w(()=>setDoc(doc(db,"projects",uid()),{name:n,status:"open"}))};
 const st=q("#set");if(st)st.onclick=()=>{const n=prompt("Company name:",S.cfg.name||"ECG");if(n===null)return;const f=document.createElement("input");f.type="file";f.accept="image/*";
  const save=l=>w(()=>setDoc(doc(db,"settings","company"),{name:n.trim()||"ECG",logo:l||S.cfg.logo||""}));
  f.onchange=()=>{const fl=f.files[0];if(!fl)return save();const im=new Image();im.onload=()=>{const k=Math.min(1,240/im.width),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);save(c.toDataURL("image/png"))};im.src=URL.createObjectURL(fl)};
  confirm("Change the logo too? (OK = choose image / Cancel = name only)")?f.click():save()}}
</script></body></html>
